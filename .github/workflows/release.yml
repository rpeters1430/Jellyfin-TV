name: Release

# Push a tag like "v1.2.3" to trigger: run the unit test suite, build a signed release APK
# (versionName/versionCode derived from the tag - see app/build.gradle.kts), then publish a
# GitHub Release with the APK attached. AppUpdateManager (in-app updater) checks exactly this
# repo's "latest release" endpoint, so this workflow is what makes auto-update work at all.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version_name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore.jks"

      # Belt-and-suspenders: gradlew's executable bit has already been lost once from a
      # Windows commit (git on Windows doesn't track the x bit by default), which fails this
      # step with "Permission denied" even though it's fine in git's index. Don't depend on
      # the index staying right going forward.
      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Run unit tests and build signed release APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease --no-daemon

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/app-release.apk \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
